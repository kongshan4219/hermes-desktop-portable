name: Portable reusable validation
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character source SHA to build and test
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    if: github.repository == 'kongshan4219/hermes-desktop-portable'
    name: Windows candidate build and packaged tests
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
      - name: Match upstream npm major
        run: |
          if ((npm --version) -notmatch '^12\.') {
            npm install --global npm@12
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Record exact source and build environment
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SOURCE_SHA) { throw 'Checkout SHA mismatch' }
          New-Item -ItemType Directory -Force build-evidence | Out-Null
          [ordered]@{
            source_sha = $actual
            upstream_sha = (Get-Content docs/portable/upstream.json -Raw | ConvertFrom-Json).sha
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            node = (node --version)
            npm = (npm --version)
            run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            acceptance = 'portable-candidate-not-release-approved'
          } | ConvertTo-Json | Set-Content build-evidence/environment.json
      - name: Install from root lockfile
        run: npm ci
      - name: Typecheck Desktop
        run: npm run typecheck --workspace apps/desktop
      - name: Lint Portable integration
        working-directory: apps/desktop
        run: npx eslint electron/portable.ts electron/portable.test.ts electron/entry.ts electron/bootstrap-runner.ts electron/ssh-connection.ts electron/main.ts
      - name: Windows Portable and Windows-specific regression tests
        working-directory: apps/desktop
        run: npx vitest run --project electron electron/portable.test.ts electron/windows- electron/bootstrap-runner.test.ts electron/backend-env.test.ts electron/native-token-store.test.ts electron/secret-storage-policy.test.ts --reporter=default --reporter=json --outputFile=../../build-evidence/windows-tests.json
      - name: Build official unpacked Windows app
        env:
          GITHUB_REF_NAME: main
          GITHUB_SHA: ${{ inputs.source_sha }}
        run: npm run pack --workspace apps/desktop
      - name: Create clean Portable ZIP
        run: ./scripts/portable/package.ps1
      - name: Exercise executable from final ZIP
        run: node scripts/portable/smoke.mjs portable-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portable-evidence-${{ github.run_id }}
          path: |
            build-evidence/
            portable-out/*.json
            portable-out/*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portable-candidate-${{ github.run_id }}
          path: |
            portable-out/*.zip
            portable-out/SHA256SUMS.txt
            portable-out/portable-build.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-synthetic-credential-${{ github.run_id }}
          path: portable-out/cross-machine/
          if-no-files-found: error
          retention-days: 2
  credential-recovery:
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
      - run: npm install --global npm@12
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: portable-candidate-${{ github.run_id }}
          path: portable-out
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: portable-synthetic-credential-${{ github.run_id }}
          path: foreign-fixture
      - run: node scripts/portable/cross-machine.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portable-credential-evidence-${{ github.run_id }}
          path: portable-out/cross-machine-report.json
          if-no-files-found: warn
          retention-days: 14
  upstream-platform-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
      - run: npm install --global npm@12
      - run: npm ci
      - name: Install upstream platform test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zsh xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64
      - name: Provision the Electron Linux sandbox helper
        run: |
          sandbox_helper=$(node -e "const p=require('node:path'); process.stdout.write(p.join(p.dirname(require.resolve('electron/package.json',{paths:['apps/desktop']})),'dist','chrome-sandbox'))")
          sudo chown root:root "$sandbox_helper"
          sudo chmod 4755 "$sandbox_helper"
      - name: Complete upstream Electron platform suite on POSIX
        working-directory: apps/desktop
        run: npx vitest run --project electron --reporter=default --reporter=json --outputFile=../../platform-tests.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portable-platform-evidence-${{ github.run_id }}
          path: platform-tests.json
          if-no-files-found: warn
          retention-days: 14
  local-runtime:
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
      - run: npm install --global npm@12
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: portable-candidate-${{ github.run_id }}
          path: portable-out
      - name: Fresh local install and moved runtime reconstruction
        run: node scripts/portable/local-runtime.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portable-local-runtime-evidence-${{ github.run_id }}
          path: |
            portable-out/local-runtime-report.json
            portable-out/local-runtime-window.png
          if-no-files-found: warn
          retention-days: 14
