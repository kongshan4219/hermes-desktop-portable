name: Portable upstream sync
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-upstream-sync
  cancel-in-progress: false
jobs:
  propose:
    if: github.repository == 'kongshan4219/hermes-desktop-portable' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      source_sha: ${{ steps.sync.outputs.source_sha }}
      pr_number: ${{ steps.sync.outputs.pr_number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - id: sync
        run: node scripts/portable/upstream-sync.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  validate-candidate:
    needs: propose
    if: needs.propose.outputs.source_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/portable-build.yml
    with:
      source_sha: ${{ needs.propose.outputs.source_sha }}
  record-validation:
    needs: [propose, validate-candidate]
    if: always() && needs.propose.outputs.source_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Attach actual result to the candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.propose.outputs.source_sha }}
          VALIDATION_RESULT: ${{ needs.validate-candidate.result }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          sha = os.environ['CANDIDATE_SHA']
          assert re.fullmatch('[a-f0-9]{40}', sha)
          repo = os.environ['GITHUB_REPOSITORY']
          body = {'state': 'success' if os.environ['VALIDATION_RESULT'] == 'success' else 'failure',
                  'context': 'portable/candidate', 'description': 'Exact candidate SHA reusable validation',
                  'target_url': f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=json.dumps(body).encode(), method='POST',
              headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Content-Type': 'application/json'})
          urllib.request.urlopen(request, timeout=30).close()
          PY
