name: Portable upstream sync
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-upstream-sync
  cancel-in-progress: false
jobs:
  propose:
    if: github.repository == 'kongshan4219/hermes-desktop-portable' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      source_sha: ${{ steps.sync.outputs.source_sha }}
      pr_number: ${{ steps.sync.outputs.pr_number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - id: sync
        run: node scripts/portable/upstream-sync.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  validate-candidate:
    needs: propose
    if: needs.propose.outputs.source_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/portable-build.yml
    with:
      source_sha: ${{ needs.propose.outputs.source_sha }}
