name: Portable CI
run-name: Portable candidate - ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches: ['portable/**']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/portable-*.yml'
      - 'apps/desktop/**'
      - 'apps/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'scripts/portable/**'
      - 'docs/portable/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.repository == 'kongshan4219/hermes-desktop-portable'
    name: Windows candidate build and packaged tests
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
      - name: Match upstream npm major
        run: |
          if ((npm --version) -notmatch '^12\.') {
            npm install --global npm@12
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Record exact source and build environment
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SOURCE_SHA) { throw 'Checkout SHA mismatch' }
          New-Item -ItemType Directory -Force build-evidence | Out-Null
          [ordered]@{
            source_sha = $actual
            upstream_sha = 'be59f0411e8fffa1e6f48425f7885c5c6badb705'
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            node = (node --version)
            npm = (npm --version)
            run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            acceptance = 'portable-candidate-not-release-approved'
          } | ConvertTo-Json | Set-Content build-evidence/environment.json
      - name: Install from root lockfile
        run: npm ci
      - name: Typecheck Desktop
        run: npm run typecheck --workspace apps/desktop
      - name: Lint Portable integration
        working-directory: apps/desktop
        run: npx eslint electron/portable.ts electron/portable.test.ts electron/entry.ts electron/bootstrap-runner.ts electron/ssh-connection.ts electron/main.ts
      - name: Desktop platform tests
        working-directory: apps/desktop
        run: npx vitest run --project electron
      - name: Build official unpacked Windows app
        env:
          GITHUB_REF_NAME: main
        run: npm run pack --workspace apps/desktop
      - name: Create clean Portable ZIP
        run: ./scripts/portable/package.ps1
      - name: Exercise executable from final ZIP
        run: node scripts/portable/smoke.mjs portable-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portable-evidence-${{ github.run_id }}
          path: |
            build-evidence/
            portable-out/*.json
            portable-out/*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portable-candidate-${{ github.run_id }}
          path: |
            portable-out/*.zip
            portable-out/SHA256SUMS.txt
            portable-out/portable-build.json
          if-no-files-found: warn
          retention-days: 7
